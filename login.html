<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Hemant Gulve</title><style>
:root{--bg:#07111f;--panel:#0d1b2e;--text:#edf5ff;--muted:#91a4bb;--accent:#55d6be;--border:rgba(255,255,255,.1);--danger:#ff7182}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,rgba(85,214,190,.10),transparent 32%),var(--bg);color:var(--text);font-family:Inter,system-ui,Arial;display:grid;place-items:center}.login{width:min(430px,92%);background:rgba(13,27,46,.94);border:1px solid var(--border);border-radius:22px;padding:34px;box-shadow:0 20px 70px rgba(0,0,0,.35)}.logo{font-size:30px;font-weight:900;letter-spacing:-1px;color:var(--text);text-decoration:none}.logo span{color:var(--accent)}h1{font-size:28px;margin:28px 0 8px}.muted{color:var(--muted);line-height:1.6}label{display:block;color:var(--muted);font-size:13px;margin:20px 0 7px}input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--border);background:#091727;color:var(--text);font:inherit;outline:none}input:focus{border-color:var(--accent)}button{width:100%;margin-top:22px;border:0;border-radius:10px;padding:13px;background:var(--accent);color:#06211d;font-weight:800;font-size:15px;cursor:pointer}.error{display:none;color:var(--danger);font-size:13px;margin-top:14px}.back{display:block;text-align:center;margin-top:20px;color:var(--muted);text-decoration:none;font-size:13px}.back:hover{color:var(--text)}.note{font-size:11px;color:var(--muted);margin-top:22px;line-height:1.5;text-align:center}
</style></head><body><main class="login"><a class="logo" href="index.html">HG<span>.</span></a><h1>Admin Login</h1><p class="muted">Sign in to manage your portfolio content.</p><form id="loginForm"><label for="username">Admin ID</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign In</button><div id="error" class="error">Invalid Admin ID or password.</div></form><a class="back" href="index.html">← Back to portfolio</a><div class="note">Admin access is protected on the client side in this version. For production-grade security, connect authentication to a backend service.</div></main><script>
const ADMIN_ID='hemant';const ADMIN_PASSWORD='Hemant@2026!';const SESSION_KEY='hemantAdminAuthenticated';
if(sessionStorage.getItem(SESSION_KEY)==='true'){location.replace('admin.html')}
document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();const u=document.getElementById('username').value.trim();const pw=document.getElementById('password').value;if(u===ADMIN_ID&&pw===ADMIN_PASSWORD){sessionStorage.setItem(SESSION_KEY,'true');location.replace('admin.html')}else{document.getElementById('error').style.display='block'}});
</script></body></html>
